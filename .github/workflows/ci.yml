name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    # Never run fork pull requests: CI may use a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted by default (free for this public repository; the shared
    # writeitai-pool does not serve it). The repository variable CI_RUNNER (a
    # JSON array of labels) moves jobs to the self-hosted slot during outages.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Showcase demos keep credentials out of sandbox traces
        run: python3 examples/showcase/test_showcase.py
      - name: Spend-cap and webhook showcases stay offline and signed
        run: python3 examples/showcase/test_limits.py
      - name: Multi-agent harness verifies signed handoffs and read-only tickets
        run: python3 examples/research-showcases/multi-agent-harness/test_harness.py
      - name: Mac/Linux handoff takes turns, refuses reuse and times out on wrong bytes
        run: python3 -m unittest discover -s examples/mac-linux-handoff -p 'test_*.py'
      - name: Slack file webhook verifies signatures and posts once
        run: python3 -m unittest discover -s examples/slack-file-webhook -p 'test_*.py'
      - name: THIRD_PARTY_NOTICES matches the module graph
        run: |
          go run ./tools/notices > THIRD_PARTY_NOTICES
          git diff --exit-code THIRD_PARTY_NOTICES || {
            echo "::error::THIRD_PARTY_NOTICES is stale; run: go run ./tools/notices > THIRD_PARTY_NOTICES"
            exit 1
          }
      - name: Build and install both packages
        run: |
          packaging/build.sh 0.0.0
          npx -y --package ./dist/mountable-cli-0.0.0.tgz mountable version | grep -x "mountable 0.0.0"
          uvx --from ./dist/mountable-0.0.0-py3-none-any.whl mountable version | grep -x "mountable 0.0.0"
      - name: The npm package keeps the MCP Registry name
        run: |
          tar -xzOf dist/mountable-cli-0.0.0.tgz package/package.json |
            python3 -c 'import json, sys; assert json.load(sys.stdin)["mcpName"] == "io.github.writeitai/mountable"'
      - name: Every channel carries the license and notices
        run: |
          tar -tzf dist/mountable-cli-0.0.0.tgz | grep -x package/THIRD_PARTY_NOTICES
          tar -tzf dist/mountable-cli-0.0.0.tgz | grep -x package/LICENSE
          unzip -l dist/mountable-0.0.0-py3-none-any.whl | grep -q "licenses/THIRD_PARTY_NOTICES$"
          unzip -l dist/mountable-0.0.0-py3-none-any.whl | grep -q "licenses/LICENSE$"
          for archive in dist/release/mountable-*.tar.gz; do
            test "$(tar -tzf "$archive" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE THIRD_PARTY_NOTICES mountable "
          done
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          tar -xzOf dist/release/mountable-linux-amd64.tar.gz mountable > "$RUNNER_TEMP/mountable"
          chmod +x "$RUNNER_TEMP/mountable"
          "$RUNNER_TEMP/mountable" version | grep -x "mountable 0.0.0"
          "$RUNNER_TEMP/mountable" licenses | cmp - THIRD_PARTY_NOTICES

  sdk-python:
    name: Python SDK
    # Never run fork pull requests: CI may use a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # pyright runs on Node
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - name: LLM provider starters use capped workspaces and signed webhooks
        run: uv run --locked python -m unittest discover -s ../../examples/llm-providers -p 'test_*.py'
      - name: Notebook starters run against a fake files API
        run: uv run --locked --with marimo==0.25.2 python ../../examples/notebooks/test_notebooks.py
      - name: Framework and memory examples exercise real SDKs over fake HTTP
        working-directory: examples/external-integrations
        env:
          MEM0_TELEMETRY: "false"
          MEM0_DIR: ${{ runner.temp }}/mem0
        run: |
          uv run --locked --python 3.12 ruff format --check .
          uv run --locked --python 3.12 ruff check .
          uv run --locked --python 3.12 pytest -q
      - name: Claude handoff tools keep the filesystem and note backend-selected
        working-directory: examples/claude-workspace
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: OpenAI Agents tools bind files to the backend-selected user
        working-directory: examples/openai-agents
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: LangGraph nodes share a filesystem across a fresh checkpoint
        working-directory: examples/langgraph-workspace
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Semantic Kernel dispatch keeps notes backend-selected
        working-directory: examples/semantic-kernel-workspace
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Strands Agents tools keep notes backend-selected
        working-directory: examples/strands-workspace
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: smolagents tools keep a note across a fresh process
        working-directory: examples/smolagents-workspace
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: FastAPI returns a report after the API process restarts
        working-directory: examples/fastapi-reports
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: CSV-to-Parquet batches resume after a restart
        working-directory: examples/csv-parquet-batches
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Git source history and generated output handoff
        working-directory: examples/git-and-output
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: LlamaIndex closed snapshots verify before loading
        working-directory: examples/llamaindex-snapshot
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Haystack pipeline YAML is verified before a fresh local run
        working-directory: examples/haystack-pipeline
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Prefect task report is read by a fresh flow process
        working-directory: examples/prefect-task-report
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Dagster materialization report is read by a fresh process
        working-directory: examples/dagster-materialization
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Tests on the oldest supported Python
        run: uv run --locked --isolated --python 3.10 pytest
      - run: uv build

  sdk-typescript:
    name: TypeScript SDK
    # Never run fork pull requests: CI may use a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Mastra tools use backend-selected files across fresh workflows
        working-directory: examples/mastra-workspace
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: AI SDK file tools and minimal Next.js app
        working-directory: examples/vercel-ai-workspace
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: The built package on the oldest supported Node
        run: node test/smoke.mjs

  playwright-artifacts:
    name: Playwright artifact example
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/playwright-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  langgraph-js:
    name: LangGraph.js nodes share a filesystem across a fresh process
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/langgraph-js-workspace
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deno-note:
    name: Deno note uses the released TypeScript SDK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/deno-note
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Deno 2.9.8
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$RUNNER_TEMP/deno" sh -s v2.9.8
          echo "$RUNNER_TEMP/deno/bin" >> "$GITHUB_PATH"
      - name: Offline tests with the pinned lockfile
        run: deno task test
