[project]
name = "mountable-fastapi-reports-example"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "mountable-sdk==0.3.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
