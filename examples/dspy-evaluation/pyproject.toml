[project]
name = "mountable-dspy-evaluation-example"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["dspy==3.4.1", "mountable-sdk==0.3.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
