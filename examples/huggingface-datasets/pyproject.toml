[project]
name = "mountable-huggingface-datasets-example"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "datasets==5.1.0",
    "mountable-sdk==0.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
