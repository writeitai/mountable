[project]
name = "mountable-llamaindex-snapshot-example"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["llama-index-core==0.14.25", "mountable-sdk==0.3.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
