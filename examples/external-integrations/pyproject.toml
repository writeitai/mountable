[project]
name = "mountable-external-integration-examples"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "mountable-sdk==0.1.0",
    "pydantic-ai-slim==2.60.0",
    "mem0ai==2.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
