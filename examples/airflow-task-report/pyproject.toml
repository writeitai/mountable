[project]
name = "mountable-airflow-task-report-example"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.3.2",
    "mountable-sdk==0.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

# Re-lock against Airflow's published constraints for this Python version:
# https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
# uv lock --python 3.12 --constraint <that url>
